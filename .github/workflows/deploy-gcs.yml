name: Deploy to GCS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_FORM_KEY: ${{ secrets.VITE_FORM_KEY }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Upload assets (long-term cache)
        run: |
          gsutil -m rsync -r -d dist/ gs://${{ secrets.GCS_BUCKET }}/

      - name: Set Cache-Control for hashed assets
        run: |
          gsutil -m setmeta \
            -h "Cache-Control:public, max-age=31536000, immutable" \
            "gs://${{ secrets.GCS_BUCKET }}/assets/**" || true

      - name: Set Cache-Control for index.html (no-cache)
        run: |
          gsutil setmeta \
            -h "Cache-Control:no-cache, no-store, must-revalidate" \
            "gs://${{ secrets.GCS_BUCKET }}/index.html"
